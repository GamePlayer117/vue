
<h2 class="sr-only">Diagram alur Vue Router dari Home ke Product, lengkap dengan struktur file, guard, dan lazy loading</h2>
<svg width="100%" viewBox="0 0 680 520" role="img">
  <title>Vue Router: Home → Product flow</title>
  <desc>Diagram alur routing Vue dari file router/index.js ke halaman Home dan Product, lengkap dengan navigation guard dan lazy loading</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- App.vue (entry) -->
  <g class="node c-gray" onclick="sendPrompt('Apa fungsi RouterView di App.vue?')">
    <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">App.vue</text>
    <text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">&lt;RouterView /&gt; — outlet utama</text>
  </g>

  <!-- Arrow down to router -->
  <line x1="340" y1="72" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>

  <!-- router/index.js -->
  <g class="node c-purple" onclick="sendPrompt('Jelaskan struktur router/index.js Vue Router')">
    <rect x="200" y="112" width="280" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">router/index.js</text>
    <text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">createRouter + createWebHistory</text>
  </g>

  <!-- Arrow left to Home, right to Product -->
  <path d="M250 164 L250 210 L160 210 L160 250" fill="none" stroke="var(--border-strong)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M430 164 L430 210 L520 210 L520 250" fill="none" stroke="var(--border-strong)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Route labels on arrows -->
  <text class="ts" x="192" y="208" text-anchor="middle">/</text>
  <text class="ts" x="488" y="208" text-anchor="middle">/products</text>

  <!-- Home page -->
  <g class="node c-teal" onclick="sendPrompt('Bagaimana cara membuat halaman Home di Vue Router?')">
    <rect x="60" y="250" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="160" y="272" text-anchor="middle" dominant-baseline="central">HomeView.vue</text>
    <text class="ts" x="160" y="290" text-anchor="middle" dominant-baseline="central">Eager loaded</text>
  </g>

  <!-- Product page -->
  <g class="node c-teal" onclick="sendPrompt('Bagaimana cara lazy loading halaman Product di Vue?')">
    <rect x="420" y="250" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="272" text-anchor="middle" dominant-baseline="central">ProductView.vue</text>
    <text class="ts" x="520" y="290" text-anchor="middle" dominant-baseline="central">Lazy loaded (dynamic import)</text>
  </g>

  <!-- Arrow from Product to Detail -->
  <line x1="520" y1="302" x2="520" y2="350" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="534" y="332" text-anchor="start">/products/:id</text>

  <!-- Product Detail (nested) -->
  <g class="node c-amber" onclick="sendPrompt('Bagaimana cara membuat route dengan params di Vue Router?')">
    <rect x="420" y="350" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="372" text-anchor="middle" dominant-baseline="central">ProductDetail.vue</text>
    <text class="ts" x="520" y="390" text-anchor="middle" dominant-baseline="central">useRoute().params.id</text>
  </g>

  <!-- Navigation Guard -->
  <g class="node c-coral" onclick="sendPrompt('Bagaimana cara membuat navigation guard di Vue Router?')">
    <rect x="200" y="370" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="290" y="392" text-anchor="middle" dominant-baseline="central">Navigation Guard</text>
    <text class="ts" x="290" y="410" text-anchor="middle" dominant-baseline="central">beforeEach — auth check</text>
  </g>

  <!-- Guard connects to router with dashed line -->
  <path d="M290 370 L290 138" fill="none" stroke="var(--border-strong)" stroke-width="0.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="455" width="600" height="48" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5"/>
  <g class="c-teal"><rect x="56" y="469" width="12" height="12" rx="3" stroke-width="0"/></g>
  <text class="ts" x="74" y="479" dominant-baseline="central">Views (halaman)</text>
  <g class="c-purple"><rect x="188" y="469" width="12" height="12" rx="3" stroke-width="0"/></g>
  <text class="ts" x="206" y="479" dominant-baseline="central">Router config</text>
  <g class="c-amber"><rect x="318" y="469" width="12" height="12" rx="3" stroke-width="0"/></g>
  <text class="ts" x="336" y="479" dominant-baseline="central">Route params</text>
  <g class="c-coral"><rect x="440" y="469" width="12" height="12" rx="3" stroke-width="0"/></g>
  <text class="ts" x="458" y="479" dominant-baseline="central">Guard / middleware</text>
</svg>
